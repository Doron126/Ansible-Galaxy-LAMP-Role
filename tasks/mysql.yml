---
- name: Validate required MySQL settings
  ansible.builtin.assert:
    that:
      - mysql_root_password | string | trim | length > 0
      - db_user | string | trim | length > 0
      - db_password | string | trim | length > 0
      - db_1 | string | trim | length > 0
      - db_2 | string | trim | length > 0
    fail_msg: >-
      Set mysql_root_password, db_user, and db_password to non-empty values.
      Use Ansible Vault for passwords.

- name: Ensure MySQL service is running
  ansible.builtin.service:
    name: mysql
    state: started

- name: Set the MySQL root password
  community.mysql.mysql_user:
    name: root
    host: localhost
    password: "{{ mysql_root_password }}"
    state: present
    update_password: always
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
    check_implicit_admin: true
  no_log: true

- name: Ensure MySQL databases are present
  community.mysql.mysql_db:
    name: "{{ item }}"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  loop:
    - "{{ db_1 }}"
    - "{{ db_2 }}"
  no_log: true

- name: Define the application user and database-scoped privileges
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    host: localhost
    priv: "{{ db_1 }}.*:ALL/{{ db_2 }}.*:ALL"
    state: present
    update_password: always
    column_case_sensitive: false
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  no_log: true
